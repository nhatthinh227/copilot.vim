<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Báo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Trang Chủ</a></li>
                <li><a href="#">Tin Tức</a></li>
                <li><a href="#">Văn Hóa</a></li>
                <li><a href="#">Thể Thao</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="banner">
            <img src="banner.jpg" alt="Banner">
        </section>
        <section class="tin-tuc">
            <h2>Tin Tức</h2>
            <ul>
                <li>
                    <a href="#">
                        <img src="tin-tuc-1.jpg" alt="Tin Tức 1">

                        <p>Mô tả tin tức 1</p>
                    </a>
                </li>
                <li>
                    <a href="#">

                    </a>
                </li>
            </ul>
        </section>
        <section class="van-hoa">
            <h2>Văn Hóa</h2>
            <ul>
                <li>
                    <a href="#">
                        <img src="van-hoa-1.jpg" alt="Văn Hóa 1">
                        <h3>Văn Hóa 1</h3>
                        <p>Mô tả văn hóa 1</p>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="van-hoa-2.jpg" alt="Văn Hóa 2">
                        <h3>Văn Hóa 2</h3>
